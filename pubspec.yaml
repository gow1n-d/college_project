name: college_bus_attendance
description: College Bus Attendance Tracking System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.0

  # Navigation
  go_router: ^14.0.0

  # State management
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0

  # Barcode scanning (mobile)
  mobile_scanner: ^6.0.0

  # Network & connectivity
  connectivity_plus: ^6.1.0
  http: ^1.2.2
  uuid: ^4.5.1

  # Local DB (offline queue)
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0

  # CSV / file handling
  csv: ^6.0.0
  file_picker: ^8.1.0

  # Permissions
  permission_handler: ^11.3.0

  # i18n / date
  intl: ^0.20.0

  # Code generation helpers
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^6.2.0
  fl_chart: ^0.69.0
  data_table_2: ^2.5.0
  cached_network_image: ^3.4.0
  flutter_svg: ^2.0.10+1

  cupertino_icons: ^1.0.8
  barcode_widget: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  drift_dev: ^2.24.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/csv_template.csv
